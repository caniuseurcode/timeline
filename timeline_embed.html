<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: transparent;
            padding: 20px;
        }

        .timeline {
            max-width: 900px;
            margin: 0 auto;
        }

        .timeline-title {
            color: #FF7E36;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .date {
            color: #FF7E36;
            font-size: 16px;
            font-weight: 600;
            min-width: 90px;
            flex-shrink: 0;
        }

        .badge {
            background: #FF7E36;
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
            flex-shrink: 0;
        }

        .content {
            color: #FF7E36;
            font-size: 15px;
            line-height: 1.5;
            flex: 1;
        }

        @media (max-width: 600px) {
            .timeline-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 12px 0;
                border-bottom: 1px solid rgba(255, 126, 54, 0.2);
            }

            .date {
                font-size: 14px;
            }

            .badge {
                font-size: 12px;
                padding: 5px 16px;
            }

            .content {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="timeline">
        <div class="timeline-title">NEWS</div>
        <div id="timeline"></div>
    </div>

    <script>
        // ============================================
        // 여기서 내용을 수정하세요!
        // ============================================
        const timelineData = [
            {
                date: "2025.12.05",
                badge: "INFO",
                content: "TEST"
            },
            {
                date: "2025.12.05",
                badge: "LIVE",
                content: "TEST"
            },
            {
                date: "2025.11.28",
                badge: "LIVE",
                content: "TEST"
            },
            {
                date: "2025.11.28",
                badge: "LIVE",
                content: "TEST"
            },
            {
                date: "2024.01.23",
                badge: "AVEX",
                content: "Big-Up!で週間楽曲ランキング4位を達成！"
            },
            {
                date: "2024.01.23",
                badge: "AVEX",
                content: "Big-Up!で週間アーティストランキング1位を達成"
            },
            {
                date: "2024.01.10",
                badge: "VOCALOID DEBUT",
                content: "初めてボカロ曲を発表した日です。"
            }
        ];
        // ============================================

        // 타임라인 렌더링
        const timelineContainer = document.getElementById('timeline');
        
        timelineData.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'timeline-item';
            itemDiv.innerHTML = `
                <div class="date">${item.date}</div>
                <div class="badge">${item.badge}</div>
                <div class="content">${item.content}</div>
            `;
            timelineContainer.appendChild(itemDiv);
        });
    </script>
</body>
</html>
